<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sehrish – Fashion &amp; Textile Designer | Brand Manager</title>
<meta name="description" content="13+ years in fashion and textile design: collection planning, prints, apparel and AI-assisted creative workflows.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Hanken+Grotesk:wght@400;500&display=swap">
<style>
:root{--bg:#0a0f12;--card:#121a1f;--ink:#f1f5f6;--mute:#9aaab2;--acc:#25b5a8;--accink:#04201d;--line:#22303a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root{--bg:#f6f9f9;--card:#fff;--ink:#0d1a1f;--mute:#53656d;--acc:#12877d;--accink:#fff;--line:#d6e1e3;color-scheme:light}}
html{scroll-behavior:smooth;scroll-padding-top:76px;height:100%}*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 'Hanken Grotesk',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0;line-height:1.05;letter-spacing:-.025em}a{color:inherit}
.w{max-width:1160px;margin:0 auto;padding:0 24px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
header .w{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{font:800 21px 'Bricolage Grotesque',sans-serif;text-decoration:none}.logo i{color:var(--acc);font-style:normal}
nav{display:flex;gap:26px}nav a{text-decoration:none;color:var(--mute);font-size:15px}nav a:hover{color:var(--acc)}
.btn{display:inline-block;padding:13px 26px;border-radius:999px;background:var(--acc);color:var(--accink);font-weight:500;text-decoration:none;border:0;font:500 16px 'Hanken Grotesk',sans-serif;cursor:pointer}
.btn.o{background:none;color:var(--ink);border:1.5px solid var(--line)}.btn.o:hover{border-color:var(--acc)}
:where(a,button,summary):focus-visible{outline:3px solid #ff7a55;outline-offset:3px}
.mb{display:none;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:56px;align-items:center;padding:72px 0 56px}
.tag{color:var(--acc);font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:13px;margin:0 0 18px}
h1{font-size:clamp(42px,6.6vw,82px);font-weight:800}h1 em{font-style:normal;color:var(--acc)}
.lede{font-size:19px;color:var(--mute);max-width:50ch;margin:24px 0 32px}.hero .btn+.btn{margin-left:10px}.hero .btn{margin-bottom:10px}
.hero img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;border-radius:24px;display:block}
.mq{overflow:hidden;border-block:1px solid var(--line);padding:18px 0;margin-bottom:8px}
.mt{display:flex;gap:16px;width:max-content;animation:sc 45s linear infinite}.mt img{height:150px;width:auto;border-radius:12px;display:block}
@keyframes sc{to{transform:translateX(-50%)}}@media(prefers-reduced-motion:reduce){.mt{animation:none}.mq{overflow-x:auto}html{scroll-behavior:auto}}
section{padding:84px 0}h2{font-size:clamp(32px,4.6vw,56px);font-weight:800;margin-bottom:16px}.sub{color:var(--mute);max-width:62ch;margin:0 0 40px}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px}.stats b{display:block;font:800 46px/1 'Bricolage Grotesque',sans-serif;color:var(--acc)}.stats span{color:var(--mute);font-size:15px}
.sv{border-top:1px solid var(--line)}.sv div{display:grid;grid-template-columns:90px 1fr 1.2fr;gap:24px;padding:32px 0;border-bottom:1px solid var(--line);align-items:start}
.sv small{font:700 22px 'Bricolage Grotesque',sans-serif;color:var(--acc)}.sv h3{font-size:clamp(22px,2.6vw,30px)}.sv p{margin:0;color:var(--mute)}
.xp{display:grid;grid-template-columns:1fr 1fr;gap:16px}.xp div{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px}.xp b{font:800 24px 'Bricolage Grotesque',sans-serif;color:var(--acc)}.xp h3{font-size:19px;line-height:1.25;letter-spacing:-.01em;font-weight:700}@media(max-width:860px){.xp{grid-template-columns:1fr}}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}.chips button{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 20px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.tile{all:unset;cursor:zoom-in;display:block;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}.tile:focus-visible{outline:3px solid #ff7a55}.tile[hidden]{display:none}
.tile img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}.tile span{display:block;padding:14px 18px;font:700 17px 'Bricolage Grotesque',sans-serif}
.ex{display:grid;grid-template-columns:1.3fr 1fr;gap:56px}.row{display:grid;grid-template-columns:140px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.row small{color:var(--acc);font-weight:500}.row h3{font-size:20px}.row p{margin:2px 0 0;color:var(--mute);font-size:16px}
ul.t{list-style:none;margin:0;padding:0}ul.t li{padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--line)}
ul.t li::before{content:"";position:absolute;left:4px;top:21px;width:12px;height:7px;border-left:2.5px solid var(--acc);border-bottom:2.5px solid var(--acc);transform:rotate(-45deg)}
.certs{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;margin-top:36px;align-items:start}.certs img{width:100%;border-radius:18px;border:1px solid var(--line);display:block}
details{border-bottom:1px solid var(--line);padding:20px 0}summary{cursor:pointer;font:700 clamp(18px,2.2vw,23px) 'Bricolage Grotesque',sans-serif;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}summary::after{content:"+";color:var(--acc);font-size:28px;line-height:1}details[open] summary::after{content:"–"}details p{color:var(--mute);margin:12px 0 0;max-width:70ch}
.cta{background:var(--acc);color:var(--accink);border-radius:28px;padding:64px;display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-bottom:84px}.cta h2{margin:0}
.cta ul{list-style:none;margin:0 0 22px;padding:0}.cta li{padding:12px 0;border-bottom:1px solid currentColor;display:grid;grid-template-columns:80px 1fr;gap:10px}.cta li span{opacity:.7}.cta a{text-decoration:none;word-break:break-word}
.cta form{display:grid;gap:12px}.cta label{display:grid;gap:4px;font-size:14px}.cta input,.cta textarea{font:inherit;font-size:16px;padding:11px 14px;border-radius:12px;border:0;background:#fff;color:#0d1a1f;width:100%}
.cta button{justify-self:start;background:#0d1a1f;color:#fff}.cta :focus-visible{outline-color:#0d1a1f}
footer{border-top:1px solid var(--line);padding:26px 0;text-align:center;color:var(--mute);font-size:14px}
dialog{border:0;background:#000;color:#fff;max-width:none;max-height:none;width:100%;height:100%;padding:20px;margin:0}dialog img{max-width:100%;max-height:calc(100% - 50px);display:block;margin:auto}dialog p{text-align:center;margin:10px 0 0}
.x{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:18px;background:none;border:1px solid #fff6;color:#fff;padding:6px 16px;border-radius:8px;font:inherit;cursor:pointer}
@media(max-width:860px){.hero,.ab,.ex,.cta,.certs{grid-template-columns:1fr}.hero{gap:32px;padding-top:36px}.hero img{max-height:440px}.sv div{grid-template-columns:1fr;gap:8px}.row{grid-template-columns:1fr;gap:2px}.cta{padding:34px 24px}section{padding:56px 0}.mb{display:block}
nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;padding:6px 24px 14px;background:var(--bg);border-bottom:1px solid var(--line)}nav.open{display:flex}nav a{padding:14px 0;font-size:17px;border-bottom:1px solid var(--line)}header .btn{display:none}}
</style></head><body><div id="app"></div><noscript>Please enable JavaScript to view this site.</noscript>
<dialog id="lb"><button class="x" id="cl">Close</button><img alt=""><p></p></dialog>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const e=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const ext=u=>/^https?:/.test(u)?' target="_blank" rel="noopener noreferrer"':'';
const u=s=>String(s||'').replace(/^\//,'');const pad=n=>String(n).padStart(2,'0');
const head=x=>'<p class="tag">'+e(x.tag)+'</p><h2>'+e(x.title)+'</h2><p class="sub">'+e(x.sub)+'</p>';
const tel=n=>'tel:+92'+n.replace(/\D/g,'').replace(/^0/,'');
fetch('site.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{
document.title=d.title;const h=d.hero,a=d.about,x=d.expertise,sv=d.services,p=d.portfolio,x2=d.experience,f=d.faq,c=d.contact;
const cats=[...new Set(p.items.map(i=>i.category))];
$('#app').innerHTML=
'<header><div class="w"><a class="logo" href="#top">'+e(d.brand)+'<i>.</i></a><nav id="nv">'+d.nav.map(n=>'<a href="'+e(n.url)+'"'+ext(n.url)+'>'+e(n.label)+'</a>').join('')+'</nav><a class="btn" href="'+e(d.nav_button.url)+'"'+ext(d.nav_button.url)+'>'+e(d.nav_button.label)+'</a><button class="mb" id="mb" aria-expanded="false" aria-controls="nv">Menu</button></div></header>'+
'<main id="top"><div class="w"><div class="hero"><div><p class="tag">'+e(h.tag)+'</p><h1>'+e(h.headline_a)+' <em>'+e(h.headline_em)+'</em> '+e(h.headline_b)+'</h1><p class="lede">'+e(h.lede)+'</p><div class="bt">'+h.buttons.map(b=>'<a class="btn'+(b.style==='outline'?' o':'')+'" href="'+e(b.url)+'"'+ext(b.url)+'>'+e(b.label)+'</a>').join('')+'</div></div><img src="'+e(u(h.image))+'" alt="'+e(h.alt)+'"></div></div><div class="mq" aria-hidden="true"><div class="mt" id="mt"></div></div>'+
'<section id="about"><div class="w ab"><div><p class="tag">'+e(a.tag)+'</p><h2>'+e(a.title)+'</h2><p class="sub" style="margin:0">'+e(a.text)+'</p></div><div class="stats">'+a.stats.map(s=>'<div><b>'+e(s.value)+'</b><span>'+e(s.label)+'</span></div>').join('')+'</div></div></section>'+
'<section id="expertise"><div class="w">'+head(x)+'<div class="xp">'+x.items.map((t,i)=>'<div><b>'+pad(i+1)+'</b><h3>'+e(t)+'</h3></div>').join('')+'</div></div></section>'+
'<section id="services"><div class="w">'+head(sv)+'<div class="sv">'+sv.items.map((s,i)=>'<div><small>'+pad(i+1)+'.</small><h3>'+e(s.title)+'</h3><p>'+e(s.text)+'</p></div>').join('')+'</div></div></section>'+
'<section id="portfolio"><div class="w">'+head(p)+'<div class="chips" role="group" aria-label="Filter projects"><button aria-pressed="true" data-f="All">All</button>'+cats.map(k=>'<button aria-pressed="false" data-f="'+e(k)+'">'+e(k)+'</button>').join('')+'</div><div class="grid">'+p.items.map(i=>'<button class="tile" data-c="'+e(i.category)+'"><img loading="lazy" alt="'+e(i.title)+'" src="'+e(u(i.image))+'"><span>'+e(i.title)+'</span></button>').join('')+'</div></div></section>'+
'<section id="experience"><div class="w ex"><div>'+head(x2)+x2.rows.map(r=>'<div class="row"><small>'+e(r.period)+'</small><div><h3>'+e(r.company)+'</h3><p>'+e(r.role)+'</p></div></div>').join('')+'</div><div><p class="tag">'+e(x2.strengths_tag)+'</p><h2>'+e(x2.strengths_title)+'</h2><p class="sub"></p><ul class="t">'+x2.strengths.map(s=>'<li>'+e(s)+'</li>').join('')+'</ul></div></div><div class="w"><div class="certs">'+x2.certs.map(i=>'<img loading="lazy" src="'+e(u(i.image))+'" alt="'+e(i.alt)+'">').join('')+'</div></div></section>'+
'<section><div class="w">'+head(f)+f.items.map(i=>'<details><summary>'+e(i.q)+'</summary><p>'+e(i.a)+'</p></details>').join('')+'</div></section>'+
'<section id="contact" style="padding-top:0"><div class="w"><div class="cta"><div><h2>'+e(c.title)+'</h2><p style="margin:16px 0 28px;max-width:40ch">'+e(c.text)+'</p><ul><li><span>Email</span><a href="mailto:'+e(c.email)+'">'+e(c.email)+'</a></li><li><span>Phone</span><span style="opacity:1">'+c.phones.map(n=>'<a href="'+tel(n.number)+'">'+e(n.number)+'</a>').join(' / ')+'</span></li><li><span>Social</span><span style="opacity:1">'+c.socials.map(s=>'<a href="'+e(s.url)+'" target="_blank" rel="noopener noreferrer">'+e(s.label)+'</a>').join(' · ')+'</span></li></ul></div><form id="cf"><label>Name<input name="n" autocomplete="name"></label><label>Email *<input name="e" type="email" required autocomplete="email"></label><label>Message<textarea name="m" rows="5"></textarea></label><button class="btn" type="submit">Send</button></form></div></div></section></main><footer>'+e(d.footer)+'</footer>';
const mt=$('#mt');for(let k=0;k<2;k++)$$('.tile img').forEach(s=>{const i=document.createElement('img');i.src=s.src;i.alt='';mt.appendChild(i)});
const lb=$('#lb'),mb=$('#mb'),nv=$('#nv');
$('#cf').onsubmit=ev=>{ev.preventDefault();const t=ev.target;location.href='mailto:'+c.email+'?subject='+encodeURIComponent('Portfolio message'+(t.n.value?' from '+t.n.value:''))+'&body='+encodeURIComponent(t.m.value+'\n\n'+t.n.value+'\n'+t.e.value)};
mb.onclick=()=>mb.setAttribute('aria-expanded',nv.classList.toggle('open'));
nv.onclick=ev=>{if(ev.target.closest('a')){nv.classList.remove('open');mb.setAttribute('aria-expanded','false')}};
document.addEventListener('click',ev=>{const b=ev.target.closest('.chips button');
if(b){$$('.chips button').forEach(z=>z.setAttribute('aria-pressed',z===b));$$('.tile').forEach(t=>t.hidden=b.dataset.f!=='All'&&t.dataset.c!==b.dataset.f);return}
const t=ev.target.closest('.tile');if(t){const i=$('img',t),q=$('img',lb);q.src=i.src;q.alt=i.alt;$('p',lb).textContent=i.alt;lb.showModal()}});
$('#cl').onclick=()=>lb.close();lb.onclick=ev=>{if(ev.target===lb)lb.close()};
if(location.hash){const el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView()}
}).catch(()=>{$('#app').innerHTML='<p style="padding:40px">Could not load the site content.</p>'});
</script></body></html>
