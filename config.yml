backend:
  name: github
  repo: sehrishbrandmanager/myportfolio
  branch: main
media_folder: uploads
public_folder: uploads
collections:
- name: site
  label: Website
  files:
  - name: site
    label: Website content
    file: site.json
    fields:
    - name: title
      label: Browser tab title
      widget: string
    - name: brand
      label: Logo name
      widget: string
    - name: nav
      label: Menu links
      widget: list
      fields:
      - name: label
        label: Text
        widget: string
      - name: url
        label: 'Link (https://…, #section, mailto:…)'
        widget: string
    - name: nav_button
      label: Top-right button
      widget: object
      fields:
      - name: label
        label: Text
        widget: string
      - name: url
        label: 'Link (https://…, #section, mailto:…)'
        widget: string
    - name: hero
      label: Home (top)
      widget: object
      fields:
      - name: tag
        label: Small label
        widget: string
      - name: headline_a
        label: 'Headline: start'
        widget: string
      - name: headline_em
        label: 'Headline: highlighted words'
        widget: string
      - name: headline_b
        label: 'Headline: end'
        widget: string
      - name: lede
        label: Intro text
        widget: text
      - name: buttons
        label: Buttons
        widget: list
        fields:
        - name: label
          label: Text
          widget: string
        - name: url
          label: 'Link (https://…, #section, mailto:…)'
          widget: string
        - name: style
          label: Style
          widget: select
          options:
          - primary
          - outline
      - name: image
        label: Photo
        widget: image
      - name: alt
        label: Photo description
        widget: string
    - name: about
      label: About
      widget: object
      fields:
      - name: tag
        label: Small label
        widget: string
      - name: title
        label: Heading
        widget: string
      - name: text
        label: Text
        widget: text
      - name: stats
        label: Numbers
        widget: list
        fields:
        - name: value
          label: Number
          widget: string
        - name: label
          label: Label
          widget: string
    - name: expertise
      label: Expertise
      widget: object
      fields:
      - name: tag
        label: Small label
        widget: string
      - name: title
        label: Heading
        widget: string
      - name: sub
        label: Sub text
        widget: text
        required: false
      - name: items
        label: Expertise items
        widget: list
        field:
          name: text
          label: Item
          widget: string
    - name: services
      label: Services
      widget: object
      fields:
      - name: tag
        label: Small label
        widget: string
      - name: title
        label: Heading
        widget: string
      - name: sub
        label: Sub text
        widget: text
        required: false
      - name: items
        label: Services
        widget: list
        fields:
        - name: title
          label: Title
          widget: string
        - name: text
          label: Text
          widget: text
    - name: portfolio
      label: Portfolio
      widget: object
      fields:
      - name: tag
        label: Small label
        widget: string
      - name: title
        label: Heading
        widget: string
      - name: sub
        label: Sub text
        widget: text
        required: false
      - name: items
        label: Projects
        widget: list
        fields:
        - name: title
          label: Title
          widget: string
        - name: category
          label: Category
          widget: select
          options:
          - Apparel
          - Home textiles
          - Prints & patterns
        - name: image
          label: Image
          widget: image
    - name: experience
      label: Experience
      widget: object
      fields:
      - name: tag
        label: Small label
        widget: string
      - name: title
        label: Heading
        widget: string
      - name: sub
        label: Sub text
        widget: text
        required: false
      - name: rows
        label: Jobs
        widget: list
        fields:
        - name: period
          label: Years
          widget: string
        - name: company
          label: Company
          widget: string
        - name: role
          label: What you did
          widget: text
      - name: strengths_tag
        label: 'Right column: small label'
        widget: string
      - name: strengths_title
        label: 'Right column: heading'
        widget: string
      - name: strengths
        label: Strengths
        widget: list
        field:
          name: text
          label: Strength
          widget: string
      - name: certs
        label: Certificate images
        widget: list
        fields:
        - name: image
          label: Image
          widget: image
        - name: alt
          label: Description
          widget: string
    - name: faq
      label: FAQ
      widget: object
      fields:
      - name: tag
        label: Small label
        widget: string
      - name: title
        label: Heading
        widget: string
      - name: sub
        label: Sub text
        widget: text
        required: false
      - name: items
        label: Questions
        widget: list
        fields:
        - name: q
          label: Question
          widget: string
        - name: a
          label: Answer
          widget: text
    - name: contact
      label: Contact
      widget: object
      fields:
      - name: title
        label: Heading
        widget: string
      - name: text
        label: Text
        widget: text
      - name: email
        label: Email
        widget: string
      - name: phones
        label: Phone numbers
        widget: list
        fields:
        - name: number
          label: Number
          widget: string
      - name: socials
        label: Social links
        widget: list
        fields:
        - name: label
          label: Text
          widget: string
        - name: url
          label: Link
          widget: string
    - name: footer
      label: Footer text
      widget: string
